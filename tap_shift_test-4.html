<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tap Shift</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none}
body{background:#070910;color:#fff;font-family:Arial,sans-serif;overflow:hidden;height:100vh}
button,input{font:inherit}
button{border:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}
#menu{background:radial-gradient(circle at 50% 25%,#172b45 0,#0a0d17 48%,#05060b 100%)}
.logo{font-size:48px;font-weight:900;letter-spacing:3px;color:#00e5ff;text-shadow:0 0 20px #00e5ff;margin-bottom:8px}
.subtitle{color:#8ea0b7;margin-bottom:42px}
.menuBtn,.actionBtn{width:220px;padding:15px;margin:7px;border-radius:16px;background:#00e5ff;color:#041016;font-weight:800;font-size:18px;box-shadow:0 0 18px rgba(0,229,255,.28)}
.secondary{background:#1a2231;color:#fff;box-shadow:none}
.small{width:180px;font-size:15px}
.panel{width:min(90vw,390px);background:rgba(16,22,35,.94);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:24px;box-shadow:0 15px 45px #0008}
.panel h2{text-align:center;margin-bottom:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}
.row label{color:#dbe5f2}
.range{width:150px}
.back{margin-top:10px}
.form input{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #334055;background:#0b101b;color:#fff;outline:none}
.message{text-align:center;min-height:22px;color:#ffd166;margin:7px 0;font-size:14px}
#game{display:none;position:absolute;inset:0;overflow:hidden;background:linear-gradient(90deg,transparent 32.8%,rgba(255,255,255,.07) 33%,transparent 33.2%,transparent 66.5%,rgba(255,255,255,.07) 66.7%,transparent 66.9%),linear-gradient(#111725,#070910)}
#game.active{display:block}
.lane-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.07)}
#top{position:absolute;top:15px;left:0;width:100%;display:flex;justify-content:space-around;z-index:10}
.stat{background:#0006;padding:8px 12px;border-radius:14px;font-size:16px;font-weight:bold}
#player{width:38px;height:38px;border-radius:50%;position:absolute;bottom:210px;left:50%;transform:translateX(-50%);background:#00e5ff;box-shadow:0 0 10px #00e5ff,0 0 25px #00e5ff;transition:left .12s ease;z-index:5}
.obstacle{position:absolute;width:54px;height:54px;border-radius:13px;background:#ff315c;box-shadow:0 0 12px #ff315c,0 0 28px #ff315c99;z-index:4;transition:background .65s ease,box-shadow .65s ease,filter .65s ease}
.obstacle.colorShift{animation:colorShift .9s ease}
@keyframes colorShift{0%{filter:brightness(1);transform:scale(1)}35%{filter:brightness(2);transform:scale(1.16)}100%{filter:brightness(1);transform:scale(1)}}
#comboText,#stageText{position:absolute;left:50%;transform:translate(-50%,-50%);font-weight:bold;pointer-events:none;z-index:12;opacity:0}
#comboText{top:42%;font-size:34px;color:#ffe600}
#stageText{top:34%;font-size:24px;color:#fff;text-shadow:0 0 12px #fff}
.comboAnim{animation:combo .45s ease}.stageAnim{animation:stagePulse 1.1s ease}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes stagePulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}65%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
#hint{position:absolute;bottom:25px;width:100%;text-align:center;color:#ffffff66;font-size:13px}
#gameOver{display:none;position:absolute;inset:0;background:#000d;z-index:20;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#gameOver.active{display:flex}
#gameOver h1{font-size:42px;color:#ff315c;margin-bottom:14px}
#finalScore{font-size:21px;margin-bottom:20px}
#userBadge{position:absolute;top:16px;right:14px;color:#9eb1c8;font-size:12px}
.rankItem{display:flex;justify-content:space-between;padding:12px 8px;border-bottom:1px solid #ffffff12}
.rankItem:last-child{border-bottom:0}
.rankNum{width:35px;color:#00e5ff;font-weight:bold}
.rankName{flex:1}
.rankScore{font-weight:bold}
.empty{text-align:center;color:#8998aa;padding:15px}
</style>
</head>
<body>

<section id="menu" class="screen active">
  <div class="logo">TAP SHIFT</div>
  <div class="subtitle">SWIPE • DODGE • SURVIVE</div>
  <div id="userBadge"></div>
  <button class="menuBtn" onclick="startGame()">OYNA</button>
  <button class="menuBtn secondary" onclick="showScreen('settings')">⚙ AYARLAR</button>
  <button class="menuBtn secondary" onclick="showScreen('account')">👤 HESAB</button>
  <button class="menuBtn secondary" onclick="showScreen('ranking')">🏆 SIRALAMA</button>
</section>

<section id="settings" class="screen">
  <div class="panel">
    <h2>AYARLAR</h2>
    <div class="row"><label>🎵 Musiqi</label><input id="musicToggle" type="checkbox" checked></div>
    <div class="row"><label>🔊 Musiqi səsi</label><input id="musicVolume" class="range" type="range" min="0" max="100" value="35"></div>
    <div class="row"><label>📳 Titrəşmə</label><input id="vibrationToggle" type="checkbox" checked></div>
    <div class="row"><label>🔔 Effekt səsi</label><input id="sfxVolume" class="range" type="range" min="0" max="100" value="60"></div>
    <button class="actionBtn back" onclick="showScreen('menu')">GERİ</button>
  </div>
</section>

<section id="account" class="screen">
  <div class="panel form">
    <h2 id="accountTitle">QEYDİYYAT / GİRİŞ</h2>
    <input id="username" placeholder="Ad" maxlength="18" autocomplete="username">
    <input id="password" placeholder="Şifrə" type="password" maxlength="30" autocomplete="current-password">
    <div id="accountMessage" class="message"></div>
    <button class="actionBtn" onclick="registerUser()">QEYDİYYAT</button>
    <button class="actionBtn secondary" onclick="loginUser()">GİRİŞ</button>
    <button id="logoutBtn" class="actionBtn secondary" style="display:none" onclick="logoutUser()">ÇIXIŞ</button>
    <button class="actionBtn secondary back" onclick="showScreen('menu')">GERİ</button>
  </div>
</section>

<section id="ranking" class="screen">
  <div class="panel">
    <h2>🏆 SIRALAMA</h2>
    <div id="rankingList"></div>
    <button class="actionBtn back" onclick="showScreen('menu')">GERİ</button>
  </div>
</section>

<div id="game">
  <div class="lane-line" style="left:33.33%"></div>
  <div class="lane-line" style="left:66.66%"></div>
  <div id="top">
    <div class="stat">SCORE: <span id="score">0</span></div>
    <div class="stat">BEST: <span id="best">0</span></div>
    <div class="stat">COMBO: <span id="combo">0</span></div>
  </div>
  <div id="player"></div>
  <div id="stageText">SPEED x2</div>
  <div id="comboText">PERFECT!</div>
  <div id="hint">BARMAĞINI SAĞA VƏ SOLA SÜRÜŞDÜR</div>
  <div id="gameOver">
    <h1>GAME OVER</h1>
    <div id="finalScore">Score: 0</div>
    <button class="actionBtn" onclick="restartGame()">YENİDƏN OYNA</button>
    <button class="actionBtn secondary" onclick="goMenu()">ANA SƏHİFƏ</button>
  </div>
</div>

<script>
const game=document.getElementById("game"),player=document.getElementById("player");
const scoreText=document.getElementById("score"),bestText=document.getElementById("best"),comboTextUI=document.getElementById("combo");
const gameOver=document.getElementById("gameOver"),finalScore=document.getElementById("finalScore");
const comboPopup=document.getElementById("comboText"),stageText=document.getElementById("stageText");
let lane=1,score=0,combo=0,speed=3.5,spawnTime=900,touchStartX=0,touchStartY=0,obstacles=[],gameRunning=false,lastSpawn=0,speedLevel=0;
const MAX_SPEED=8.5;
const blockColors=["#ff4d6d","#8b5cf6","#ff9f43","#20e3b2","#00c2ff","#ff5ea8","#ffd166","#7cf29a","#6c8cff","#c084fc"];
let colorIndex=0;
let best=Number(localStorage.getItem("tapShiftBest"))||0;
bestText.textContent=best;

let settings=JSON.parse(localStorage.getItem("tapShiftSettings")||"null")||{music:true,musicVolume:.35,vibration:true,sfxVolume:.6};
musicToggle.checked=settings.music;
musicVolume.value=Math.round(settings.musicVolume*100);
vibrationToggle.checked=settings.vibration;
sfxVolume.value=Math.round(settings.sfxVolume*100);

let audioCtx=null,musicTimer=null,musicMode=null,musicStep=0;
let masterMusicGain=null;

function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  if(!masterMusicGain){
    masterMusicGain=audioCtx.createGain();
    masterMusicGain.gain.value=0.0001;
    masterMusicGain.connect(audioCtx.destination);
  }
}

function tone(freq,duration,type="sine",gain=.04,when=0,detune=0){
  if(!audioCtx || !settings.music || settings.musicVolume<=0)return;
  const now=audioCtx.currentTime+when;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;o.detune.value=detune;
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain*settings.musicVolume),now+.025);
  g.gain.exponentialRampToValueAtTime(.0001,now+duration);
  o.connect(g);g.connect(masterMusicGain);o.start(now);o.stop(now+duration+.03);
}

function stopMusic(){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null}
  musicMode=null;
  if(masterMusicGain && audioCtx){
    const now=audioCtx.currentTime;
    masterMusicGain.gain.cancelScheduledValues(now);
    masterMusicGain.gain.setTargetAtTime(.0001,now,.12);
  }
}

function playMenuMusic(){
  if(!settings.music || settings.musicVolume<=0)return;
  ensureAudio();
  if(musicMode==="menu")return;
  stopMusic(); musicMode="menu"; musicStep=0;
  masterMusicGain.gain.setTargetAtTime(.9,audioCtx.currentTime,.35);

  const chords=[
    [261.63,329.63,392.00],[220.00,277.18,329.63],
    [246.94,311.13,369.99],[196.00,246.94,293.66]
  ];
  const tick=()=>{
    if(musicMode!=="menu")return;
    const c=chords[musicStep%chords.length];
    c.forEach((f,i)=>tone(f,1.25,"sine",.045,i*.02));
    tone(c[1]*2,1.0,"triangle",.018,.08);
    musicStep++;
  };
  tick(); musicTimer=setInterval(tick,1450);
}

function playGameMusic(){
  if(!settings.music || settings.musicVolume<=0)return;
  ensureAudio();
  if(musicMode==="game")return;
  stopMusic(); musicMode="game"; musicStep=0;
  masterMusicGain.gain.setTargetAtTime(.9,audioCtx.currentTime,.18);

  const melody=[329.63,392.00,440.00,523.25,440.00,392.00,329.63,293.66];
  const bass=[164.81,196.00,220.00,196.00];
  const tick=()=>{
    if(musicMode!=="game")return;
    const n=musicStep%melody.length;
    tone(melody[n],.28,"triangle",.055,0);
    tone(melody[n]/2,.32,"sawtooth",.018,0);
    tone(bass[musicStep%4],.38,"sine",.035,0);
    if(musicStep%4===0)tone(melody[n]*2,.12,"square",.012,.02);
    musicStep++;
  };
  tick(); musicTimer=setInterval(tick,240);
}

function levelUpMusic(level){
  if(!settings.music || settings.musicVolume<=0)return;
  ensureAudio();
  const root=[261.63,293.66,329.63,349.23,392.00,440.00,493.88][level%7];
  const seq=[root,root*1.25,root*1.5,root*2,root*2.5,root*3];
  seq.forEach((f,i)=>{
    tone(f,.34,"triangle",.075,i*.075);
    tone(f/2,.42,"sine",.035,i*.075);
  });
  tone(root*4,.75,"sine",.055,.45);
}

function audioStart(){
  // Kept for compatibility: starts the calm menu soundtrack.
  playMenuMusic();
}

function sfx(freq=500){
  if(settings.sfxVolume<=0)return;
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
  o.type="sine";o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,settings.sfxVolume*.06),now+.01);
  g.gain.exponentialRampToValueAtTime(.0001,now+.11);
  o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.13);
}
function vibrate(pattern=25){if(settings.vibration&&navigator.vibrate)navigator.vibrate(pattern)}

function saveSettings(){
 settings={music:musicToggle.checked,musicVolume:Number(musicVolume.value)/100,vibration:vibrationToggle.checked,sfxVolume:Number(sfxVolume.value)/100};
 localStorage.setItem("tapShiftSettings",JSON.stringify(settings));
 if(settings.music){ if(document.getElementById("game").classList.contains("active")) playGameMusic(); else playMenuMusic(); } else stopMusic();
}
musicToggle.onchange=saveSettings;musicVolume.oninput=saveSettings;vibrationToggle.onchange=saveSettings;sfxVolume.oninput=saveSettings;

function showScreen(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById("game").classList.remove("active");
 document.getElementById(id).classList.add("active");
 if(id==="ranking")renderRanking();
 updateUserBadge();
}
function updateUserBadge(){
 const u=localStorage.getItem("tapShiftCurrentUser");
 document.getElementById("userBadge").textContent=u?"👤 "+u:"Qonaq";
}

function getUsers(){return JSON.parse(localStorage.getItem("tapShiftUsers")||"{}")}
function registerUser(){
 const name=username.value.trim(),pass=password.value;
 const msg=document.getElementById("accountMessage");
 if(name.length<3||pass.length<4){msg.textContent="Ad ən azı 3, şifrə ən azı 4 simvol olsun.";return}
 const users=getUsers();
 if(users[name]){msg.textContent="Bu ad artıq qeydiyyatdan keçib.";return}
 users[name]={password:pass,best:0};
 localStorage.setItem("tapShiftUsers",JSON.stringify(users));
 localStorage.setItem("tapShiftCurrentUser",name);
 msg.textContent="Qeydiyyat tamamlandı!";
 updateUserBadge();renderRanking();
}
function loginUser(){
 const name=username.value.trim(),pass=password.value,msg=document.getElementById("accountMessage"),users=getUsers();
 if(!users[name]||users[name].password!==pass){msg.textContent="Ad və ya şifrə yanlışdır.";return}
 localStorage.setItem("tapShiftCurrentUser",name);
 msg.textContent="Giriş uğurludur!";
 updateUserBadge();renderRanking();
}
function logoutUser(){localStorage.removeItem("tapShiftCurrentUser");updateUserBadge()}
function renderRanking(){
 const list=document.getElementById("rankingList"),users=getUsers();
 const arr=Object.entries(users).map(([name,v])=>({name,score:Number(v.best)||0})).sort((a,b)=>b.score-a.score).slice(0,20);
 list.innerHTML=arr.length?arr.map((x,i)=>`<div class="rankItem"><span class="rankNum">#${i+1}</span><span class="rankName">${escapeHtml(x.name)}</span><span class="rankScore">${x.score}</span></div>`).join(""):'<div class="empty">Hələ heç kim qeydiyyatdan keçməyib.</div>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function movePlayer(n){n=Math.max(0,Math.min(2,n));lane=n;player.style.left=["16.66%","50%","83.33%"][lane]}
game.addEventListener("touchstart",e=>{if(!gameRunning)return;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
game.addEventListener("touchend",e=>{
 if(!gameRunning)return;
 const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;
 if(Math.abs(dx)<Math.abs(dy)||Math.abs(dx)<25)return;
 movePlayer(lane+(dx>0?1:-1));sfx(650);
},{passive:true});

function applyBlockColor(){
 colorIndex=(colorIndex+1)%blockColors.length;const color=blockColors[colorIndex];
 document.querySelectorAll(".obstacle").forEach(el=>{el.style.background=color;el.style.boxShadow=`0 0 12px ${color},0 0 28px ${color}99`;el.classList.remove("colorShift");void el.offsetWidth;el.classList.add("colorShift")});
}
function speedStageEffect(){
 stageText.textContent="SPEED x"+(speedLevel+1);stageText.classList.remove("stageAnim");void stageText.offsetWidth;stageText.classList.add("stageAnim");
 applyBlockColor();levelUpMusic(speedLevel);sfx(900);vibrate([20,30,20]);
}
function spawnObstacle(){
 const obstacle=document.createElement("div");obstacle.className="obstacle";const randomLane=Math.floor(Math.random()*3);
 obstacle.style.left=`calc(${16.66+randomLane*33.33}% - 27px)`;obstacle.style.top="-60px";
 const c=blockColors[colorIndex];obstacle.style.background=c;obstacle.style.boxShadow=`0 0 12px ${c},0 0 28px ${c}99`;
 game.appendChild(obstacle);obstacles.push({element:obstacle,lane:randomLane,y:-60});
}
function collision(obj){
 const playerBottom=innerHeight-210,obstacleBottom=obj.y+54,playerTop=playerBottom-38;
 return obj.lane===lane&&obstacleBottom>=playerTop&&obj.y<=playerBottom;
}
function addScore(){
 combo++;score+=10+combo*2;scoreText.textContent=score;comboTextUI.textContent=combo;
 if(combo>=3){comboPopup.classList.remove("comboAnim");void comboPopup.offsetWidth;comboPopup.textContent="COMBO x"+combo;comboPopup.classList.add("comboAnim");}
 const newLevel=Math.floor(score/100);
 if(newLevel>speedLevel){speedLevel=newLevel;speed=Math.min(MAX_SPEED,3.5+speedLevel*.5);spawnTime=Math.max(400,900-speedLevel*35);speedStageEffect();}
}
function gameLoop(time){
 if(!gameRunning)return;
 if(time-lastSpawn>spawnTime){spawnObstacle();lastSpawn=time}
 for(let i=obstacles.length-1;i>=0;i--){
  const obj=obstacles[i];obj.y+=speed;obj.element.style.top=obj.y+"px";
  if(collision(obj)){endGame();return}
  if(obj.y>innerHeight+100){obj.element.remove();obstacles.splice(i,1);addScore()}
 }
 requestAnimationFrame(gameLoop);
}
function startGame(){
 playGameMusic();gameOver.classList.remove("active");game.classList.add("active");gameRunning=true;
 score=0;combo=0;speed=3.5;spawnTime=900;speedLevel=0;colorIndex=0;
 scoreText.textContent=0;comboTextUI.textContent=0;movePlayer(1);
 obstacles.forEach(o=>o.element.remove());obstacles=[];lastSpawn=performance.now();
 requestAnimationFrame(gameLoop);
}
function endGame(){
 gameRunning=false;vibrate([80,50,80]);sfx(180);
 if(score>best){best=score;localStorage.setItem("tapShiftBest",best)}
 const u=localStorage.getItem("tapShiftCurrentUser");
 if(u){const users=getUsers();if(users[u]&&score>Number(users[u].best||0)){users[u].best=score;localStorage.setItem("tapShiftUsers",JSON.stringify(users))}}
 bestText.textContent=best;finalScore.textContent="Score: "+score+" | Best: "+best;gameOver.classList.add("active");
}
function restartGame(){startGame()}
function goMenu(){gameRunning=false;game.classList.remove("active");gameOver.classList.remove("active");showScreen("menu")}
updateUserBadge();
document.addEventListener("pointerdown",()=>{ if(settings.music && !musicMode) playMenuMusic(); },{once:true});
</script>
</body>
</html>
